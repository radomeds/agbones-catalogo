<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monte seu boné — AG Bonés</title>
<meta name="description" content="Monte seu boné: escolha o modelo, a cor de cada parte e coloque a sua logo. Veja na foto do boné de verdade como fica e mande o pedido pelo WhatsApp.">
<link rel="icon" href="assets/marca/icon-site-ag.png">
<link rel="stylesheet" href="assets/css/estilo.css">
<link rel="stylesheet" href="assets/css/monte.css">
<meta name="theme-color" content="#2F5FD0">
<script type="importmap">
{ "imports": { "three": "./assets/js/terceiros/three/three.module.min.js" } }
</script>
</head>
<body class="corpo-monte">

<a class="pular-para-conteudo" href="#painel">Pular para as escolhas</a>

<header class="monte-topo">
  <a class="monte-topo__logo" href="index.html" aria-label="AG Bonés — página inicial">
    <img src="assets/marca/logo-agbones.svg" alt="AG Bonés" width="255" height="145">
  </a>
  <button type="button" class="monte-topo__modelo" id="trocar-modelo" aria-haspopup="dialog">
    <span class="monte-topo__rotulo">Modelo</span>
    <span class="monte-topo__nome"><strong id="nome-modelo">Escolher</strong><span id="selo-modelo"></span></span>
    <span class="monte-topo__seta" aria-hidden="true">▾</span>
  </button>
</header>

<main class="monte">

  <section class="palco" aria-label="Prévia do seu boné">
    <canvas id="tela-foto" class="palco__retrato" role="img" aria-label="Foto do boné com as cores e a logo escolhidas"></canvas>
    <canvas id="tela-3d" class="palco__tela" aria-label="Boné em 3D. Arraste para girar." hidden></canvas>
    <img id="foto-reserva" class="palco__reserva" alt="" hidden>
    <p class="palco__dica sumiu" id="dica-giro" aria-live="polite"></p>
    <button type="button" class="palco__surpresa" id="surpreenda" aria-haspopup="true" aria-expanded="false" aria-controls="caixa-surpresa">
      <span aria-hidden="true">✨</span> Surpreenda-me
    </button>
    <div class="palco__caixa" id="caixa-surpresa" hidden>
      <button type="button" class="palco__opcao" id="surpresa-logo">
        <strong>Com as cores da minha logo</strong>
        <small>Envie a imagem e o boné sai nas cores dela</small>
      </button>
      <button type="button" class="palco__opcao" id="surpresa-sorteio">
        <strong>Sem logo, me surpreenda</strong>
        <small>As combinações mais pedidas deste modelo</small>
      </button>
    </div>
    <button type="button" class="palco__girar" id="girar-3d" aria-pressed="false">
      <span aria-hidden="true">⟲</span> <span id="girar-texto">3D</span>
    </button>
    <div class="palco__vistas" role="group" aria-label="Ver o boné de" hidden>
      <button type="button" data-vista="frente">Frente</button>
      <button type="button" data-vista="laterais">Lado</button>
      <button type="button" data-vista="traseira">Trás</button>
    </div>
  </section>

  <section class="painel" id="painel" aria-label="Escolhas do boné">

    <nav class="abas" role="tablist" aria-label="O que mudar">
      <button type="button" class="abas__item" role="tab" id="aba-cores" aria-controls="etapa-cores" data-aba="cores">
        <i class="abas__marca" id="marca-cores" aria-hidden="true"></i>Cores
      </button>
      <button type="button" class="abas__item" role="tab" id="aba-logo" aria-controls="etapa-logo" data-aba="logo">
        <i class="abas__marca" id="marca-logo" aria-hidden="true"></i>Logo
      </button>
      <button type="button" class="abas__item" role="tab" id="aba-pedido" aria-controls="etapa-pedido" data-aba="pedido">
        <i class="abas__marca" id="marca-pedido" aria-hidden="true"></i>Pedido
      </button>
    </nav>

    <!-- Cores -->
    <div class="etapa" id="etapa-cores" role="tabpanel" aria-labelledby="aba-cores" data-etapa="cores">
      <p class="rotulo">Parte</p>
      <div class="fichas fichas--rolar" id="lista-partes" role="group" aria-label="Parte do boné"></div>
      <p class="rotulo"><span id="cor-escolhida">Cor</span></p>
      <div class="amostras" id="lista-cores" role="group" aria-label="Cores"></div>
      <div id="bloco-combinacoes">
        <p class="rotulo">Combinações prontas</p>
        <div class="fichas fichas--rolar" id="lista-combinacoes" role="group" aria-label="Combinações prontas"></div>
      </div>
    </div>

    <!-- Logo -->
    <div class="etapa" id="etapa-logo" role="tabpanel" aria-labelledby="aba-logo" data-etapa="logo" hidden>
      <div class="escolha-logo" id="escolha-logo" role="group" aria-label="Como colocar a logo">
        <label class="botao-grande" id="botao-enviar">
          <input type="file" id="arquivo-logo" accept="image/*" class="oculto-visual">
          <span class="botao-grande__icone" aria-hidden="true">⬆</span>
          <span>Enviar minha logo</span>
          <small>foto ou arquivo do celular</small>
        </label>
        <button type="button" class="botao-grande" id="botao-nome">
          <span class="botao-grande__icone" aria-hidden="true">Aa</span>
          <span>Escrever um nome</span>
          <small>da empresa, time ou evento</small>
        </button>
      </div>

      <div class="logo-atual" id="logo-atual" hidden>
        <div class="logo-atual__miniatura"><canvas id="miniatura-logo" width="160" height="96"></canvas></div>
        <div class="logo-atual__texto">
          <strong id="logo-atual-nome"></strong>
          <small id="logo-atual-detalhe"></small>
        </div>
        <label class="botao-mini" id="trocar-logo">
          <input type="file" id="arquivo-troca" accept="image/*" class="oculto-visual">Trocar
        </label>
        <button type="button" class="botao-mini botao-mini--fraco" id="tirar-logo">Tirar</button>
      </div>

      <div id="ajuste-nome" hidden>
        <label class="campo-curto">
          <span class="rotulo">O que vai escrito</span>
          <input type="text" id="texto-nome" maxlength="28" placeholder="Ex.: Fazenda Boa Vista" autocomplete="off">
        </label>
        <p class="rotulo">Letra</p>
        <div class="fichas fichas--rolar" id="lista-letras" role="group" aria-label="Estilo de letra"></div>
        <p class="rotulo">Cor da letra</p>
        <div class="amostras amostras--linha" id="cores-nome" role="group" aria-label="Cor da letra"></div>
      </div>

      <div id="ajuste-logo" hidden>
        <label class="trava">
          <input type="checkbox" id="tirar-fundo" checked>
          <span>Tirar o fundo branco da imagem</span>
        </label>
      </div>

      <div id="ajuste-lugar" hidden>
        <p class="rotulo">Onde vai</p>
        <div class="fichas fichas--rolar" id="lista-lugares" role="group" aria-label="Onde a logo vai"></div>
        <p class="nota" id="nota-lugar" hidden></p>

        <label class="campo-curto" id="campo-tamanho">
          <span class="rotulo">Tamanho</span>
          <input type="range" id="tamanho-logo" min="0.5" max="1.4" step="0.05" value="1">
        </label>

        <p class="rotulo">Como vai ser feita</p>
        <div class="tecnicas" id="lista-tecnicas" role="radiogroup" aria-label="Técnica"></div>
        <button type="button" class="botao-texto" id="mais-tecnicas" aria-expanded="false" hidden></button>
        <p class="nota" id="explica-tecnica"></p>
      </div>
    </div>

    <!-- Pedido -->
    <div class="etapa" id="etapa-pedido" role="tabpanel" aria-labelledby="aba-pedido" data-etapa="pedido" hidden>
      <p class="rotulo">Quantidade</p>
      <div class="quantidade">
        <button type="button" class="quantidade__botao" id="menos" aria-label="Menos 5">−</button>
        <input type="number" id="quantidade" inputmode="numeric" min="1" step="1" aria-label="Quantidade">
        <button type="button" class="quantidade__botao" id="mais" aria-label="Mais 5">+</button>
      </div>
      <div class="fichas" id="atalhos-quantidade" role="group" aria-label="Quantidades comuns"></div>
      <p class="aviso-minimo" id="aviso-minimo" hidden></p>

      <label class="campo-curto">
        <span class="rotulo">Seu nome ou da empresa</span>
        <input type="text" id="nome-cliente" autocomplete="organization" placeholder="Para a fábrica saber quem é">
      </label>

      <ul class="resumo" id="resumo"></ul>

      <button type="button" class="botao botao--vazado botao--largo" id="baixar-foto">Baixar a foto do boné</button>
      <p class="nota nota--centro">Na conversa, anexe a foto do boné e a sua logo. A fábrica confere e manda o orçamento.</p>
    </div>

  </section>

</main>

<div class="barra-monte">
  <p class="barra-monte__info" id="info-barra"></p>
  <button type="button" class="botao botao--principal barra-monte__acao" id="proximo">Próximo</button>
</div>

<!-- Escolher o modelo: uma folha que sobe de baixo -->
<div class="folha" id="folha-modelos" role="dialog" aria-modal="true" aria-labelledby="titulo-modelos" hidden>
  <div class="folha__fundo" data-fechar></div>
  <div class="folha__caixa">
    <div class="folha__topo">
      <h1 class="folha__titulo" id="titulo-modelos">Escolha o modelo</h1>
      <button type="button" class="folha__fechar" id="fechar-modelos" aria-label="Fechar" data-fechar>✕</button>
    </div>
    <div class="fichas fichas--rolar" id="filtro-tipo" role="group" aria-label="Tipo de peça"></div>
    <div class="modelos" id="lista-modelos"><p class="nota">Carregando os modelos…</p></div>
  </div>
</div>

<script type="module" src="assets/js/monte.js"></script>
</body>
</html>
